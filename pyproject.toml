[project]
name = "axion-swarm"
version = "0.1.0"
description = "Multi-agent swarm architecture with LangGraph implementing Chair, Research, Engineer, Skeptic, Context, and Ethicist agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "tavily-python>=0.5.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "textual>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
